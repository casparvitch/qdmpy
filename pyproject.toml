[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/qdmpy/_version.py"

[project]
name = "qdmpy"
dynamic = ["version"]
description = "Quantum Diamond MicroscoPy"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Sam Scholten", email = "samcaspar@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["NV", "QDM", "Diamond", "Quantum", "Quantum Sensing", "gpufit"]

dependencies = [
    "numpy",
    "matplotlib>=3.4.0",
    "scipy>=1.7",
    "numba",
    "psutil",
    "matplotlib-scalebar>=0.7.2",
    "tqdm",
    "simplejson",
    "pandas",
    "rebin",
    "pyfftw",
    "foronoi",
    "python-polylabel",
    "dill",
    "astropy",
    "PyQt6",
]

[project.optional-dependencies]
gui = [
    "FreeSimpleGUI",
]
dev = [
    "prospector[with_bandit,with_pyroma,with_vulture]",
    "ruff",
]
# cpufit and gpufit must be installed manually from local wheels
# See: just install-cpufit / just install-gpufit

[project.urls]
Homepage = "https://github.com/casparvitch/qdmpy"
Repository = "https://github.com/casparvitch/qdmpy"
Issues = "https://github.com/casparvitch/qdmpy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qdmpy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E711"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403", "F401"]
